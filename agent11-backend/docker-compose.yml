version: '3.10'
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: agent11
      POSTGRES_PASSWORD: agent11_password
      POSTGRES_DB: agent11db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent11"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: agent11
      POSTGRES_PASSWORD: agent11_password
      POSTGRES_DATABASE: agent11db
      CHROMADB_PATH: /data/chromadb
      LLM_PROVIDER: lmstudio
      LLM_BASE_URL: http://host.docker.internal:1234/v1
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - ./data/chromadb:/data/chromadb

volumes:
  postgres_data:
